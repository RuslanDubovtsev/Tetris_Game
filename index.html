<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TETRIS — NeoRetro</title>
  <!-- Пиксельный шрифт Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Анимированный пиксельный фон -->
  <div id="pixel-rain"></div>
  <div id="pixel-stars"></div>

  <!-- Декоративные пиксельные элементы -->
  <div class="pixel-corner-tl"></div>
  <div class="pixel-corner-tr"></div>
  <div class="pixel-corner-bl"></div>
  <div class="pixel-corner-br"></div>
  <div class="pixel-line-top"></div>
  <div class="pixel-line-bottom"></div>

  <div id="game-wrapper">
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="sidebar">
      <div id="controls-panel">
        <button id="style-toggle" class="retro-btn sidebar-btn">🎨 ЦВЕТНОЙ СТИЛЬ</button>
        <button id="mute-toggle" class="retro-btn sidebar-btn">🔊 ЗВУК ВКЛ</button>
      </div>
    </div>
  </div>
  <div id="footer">TETRIS · NEO RETRO</div>

  <!-- JS: порядок важен — config → utils → audio → board → tetromino → input → score → renderer → game → main -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/board.js"></script>
  <script src="js/tetromino.js"></script>
  <script src="js/input.js"></script>
  <script src="js/score.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
